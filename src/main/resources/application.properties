spring.application.name=java_template
server.port=8085

# PostgreSQL Connectivity Engine
spring.datasource.url=jdbc:postgresql://localhost:5432/core_prod_db
spring.datasource.username=engine_user
spring.datasource.password=UltimateSecretPassword999
spring.datasource.driver-class-name=org.postgresql.Driver

# Object Relational Hydration Layer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Distributed Cache Memory Cluster Architecture (Redis)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=TopSecretRedisTokenPass123

# Microservice Decoupled JWT Cryptographic Variables
template.jwt.secret=yourSuperSecretKeyMustBeVeryLongToSatisfyHS256AlgorithmRequirements!
template.jwt.accessTokenExpirationMs=900000
template.jwt.refreshTokenExpirationMs=604800000
template.jwt.accessCookieName=prod-access-token
template.jwt.refreshCookieName=prod-refresh-token